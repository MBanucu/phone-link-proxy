name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request from a fork gets a read-only token, and every check here is
# hermetic: no secrets, no phone, no publishing.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    # A cold cache pays for the Android SDK, so give it room but not forever.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # `checks` compiles the APK, runs the unit and harness suites, and checks
      # the shell/Nix formatting, the icon and the fastlane changelog.
      - name: Check the flake
        run: nix flake check --print-build-logs
