name: Release

# A tag is the only thing that publishes, and only when it names `version`. The
# APK is built from the tagged tree and signed with the release key — never the
# dev key `build.sh` generates — so a tag that does not build leaves no APK
# behind, and no branch ever produces one. The keys are repository secrets:
# `ANDROID_KEYSTORE` (the keystore, base64 so it can be a text secret),
# `ANDROID_KEYSTORE_PASS`, `ANDROID_KEY_ALIAS` and, if the key's password
# differs from the store's, `ANDROID_KEY_PASS`. `ANDROID_CERT_SHA256` is
# optional: set it to the release key's SHA-256 fingerprint and the built APK
# must carry it; unset, the job warns and publishes with the debug-key check
# alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The Android SDK comes from the flake, and a cold cache pays for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The tag is what names the artifact — `phone-link-proxy-<version>.apk` —
      # so a tag that disagrees with `version` would publish a file whose name
      # says nothing about the tag it was attached to. There is no override:
      # re-tag after bumping `version`.
      - name: Check the tag names the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(tr -d '[:space:]' < version)
          if [ -z "$version" ]; then
            echo "::error::version is empty" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not name version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $TAG names version $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # A tag must not publish code that a branch would have failed: the unit
      # tests, the formatter, the changelog and the icon are all flake checks.
      # This also compiles the APK once; the release build repeats it with the
      # release key afterwards.
      - name: Run the flake checks
        run: nix flake check --print-build-logs

      # The keystore is a binary, and a secret is text: it travels base64-encoded
      # and is written to $RUNNER_TEMP, which the runner discards with the job.
      # Every check here fails the job rather than falling back to the debug key.
      - name: Unpack the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          missing=""
          [ -n "${KEYSTORE:-}" ] || missing="$missing ANDROID_KEYSTORE"
          [ -n "${KEYSTORE_PASS:-}" ] || missing="$missing ANDROID_KEYSTORE_PASS"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — a release APK is signed with the release key, never the debug one" >&2
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          # Only the paths go into the job's environment: the passwords are read
          # from the secrets again by the step that builds, so neither is ever
          # written to a file that outlives it.
          {
            echo "PHONE_APP_KEYSTORE=$keystore"
            echo "PHONE_APP_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # The listing's icon is a rendering of artwork/launcher-icon.svg. A tag
      # cut on a tree where the SVG moved and icon.png did not would publish a
      # store picture a version behind, so this stays a named step in front of
      # the release build as well as being part of the flake checks.
      - name: Check the icon is the drawing
        run: nix build .#checks.x86_64-linux.icon --no-link

      # build.sh signs with whatever PHONE_APP_KEYSTORE names, so this is the
      # same script a local release build runs — and the certificate is read back
      # afterwards, because a build that quietly used the debug key would
      # otherwise look exactly like one that did not.
      - name: Build the APK with the release key
        env:
          PHONE_APP_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          PHONE_APP_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-release.sh" <<'SCRIPT'
          set -eu
          ./build.sh
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs build/phone-link-proxy.apk)
          printf "%s\n" "$certs"
          if printf "%s" "$certs" | grep -q "CN=phone-link proxy debug"; then
            echo "::error::the APK carries the debug key; refusing to publish it" >&2
            exit 1
          fi
          # A signature that is not the debug one is not necessarily the release
          # key: a mistyped secret would sign with another key that installs
          # nothing over the previous release. The fingerprint is public, so it
          # is a secret only to keep it in one place; when it is set it must match.
          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then
            want=$(printf "%s" "$ANDROID_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ' :')
            got=$(printf "%s\n" "$certs" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              tr 'A-F' 'a-f' | tr -d ' :')
            if [ -z "$got" ]; then
              echo "::error::could not read the APK's SHA-256 fingerprint" >&2
              exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::the APK certificate is $got, not ANDROID_CERT_SHA256 ($want)" >&2
              exit 1
            fi
            echo "certificate fingerprint matches ANDROID_CERT_SHA256"
          else
            echo "::warning::ANDROID_CERT_SHA256 is not set; the release certificate fingerprint was not pinned"
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/build-release.sh"
          nix develop --command "$RUNNER_TEMP/build-release.sh"

      # The asset is named after the app's own version, so a phone installing
      # `phone-link-proxy-0.10.0.apk` can tell what it got.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(tr -d '[:space:]' < version)
          if [ -z "$version" ]; then
            echo "::error::version is empty" >&2
            exit 1
          fi
          asset="$RUNNER_TEMP/phone-link-proxy-$version.apk"
          cp build/phone-link-proxy.apk "$asset"
          (cd "$RUNNER_TEMP" &&
            sha256sum "phone-link-proxy-$version.apk" > "phone-link-proxy-$version.apk.sha256")
          # A release for the tag may already exist with notes written by hand:
          # upload into it instead of failing, and replace what a re-run left.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          echo "attached $(basename "$asset") to $TAG" >> "$GITHUB_STEP_SUMMARY"
